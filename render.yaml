# Render Blueprint for Converty WhatsApp Notification Platform.
# Creates: web service
# PostgreSQL is provided by Neon (external) — set DATABASE_URL manually.
# The job queue and send rate limiter live in Postgres, so no Redis instance
# is provisioned.
#
# All secrets are provided via Render environment variables (not stored here).

services:
  - type: web
    name: converty-whatsapp-api
    runtime: go
    plan: free
    buildCommand: go build -o bin/api ./cmd/app && go build -o bin/migrate ./cmd/scripts/migrate
    # NOTE: free tier does not support preDeployCommand; run ./bin/migrate
    # once via the Render Shell after the first deploy, and afterwards on demand.
    startCommand: ./bin/api
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://converty-whatsapp-api.onrender.com
      - key: CONVERTY_BASE_URL
        value: https://partner.converty.shop
      - key: CONVERTY_API_URL
        value: https://api.converty.shop
      - key: CONVERTY_REDIRECT_URI
        value: https://converty-whatsapp-api.onrender.com/auth/converty/callback
      - key: CONVERTY_CLIENT_ID
        sync: false # paste your Converty OAuth client id
      - key: CONVERTY_CLIENT_SECRET
        sync: false # paste your Converty OAuth client secret
      - key: CONVERTY_ENCRYPTION_KEY
        sync: false # openssl rand -hex 32; keeps the same value across restarts
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (use the direct, non-pooled one)
      - key: SUPERKIT_SECRET
        sync: false # set manually in the Render dashboard
      - key: META_SYSTEM_USER_TOKEN
        sync: false # platform's long-lived Meta system-user token (provisioning)
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false # hub.verify_token echo challenge
      - key: META_APP_SECRET
        sync: false # verifies X-Hub-Signature-256 on Meta webhook deliveries
      - key: ADMIN_EMAIL
        sync: false # platform admin email
      - key: ADMIN_PASSWORD
        sync: false # platform admin password
